name: NoProxy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          QR_SIGNING_SECRET: noproxy_ci_hmac_secret_key_32_bytes_test
